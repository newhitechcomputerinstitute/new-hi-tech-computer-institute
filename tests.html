<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Online Tests</title><link rel="stylesheet" href="style.css"></head><body><header class="pagehead"><div class="inner"><div><h1>Online Test Series</h1><p>New Hi Tech Computer Institute</p></div><nav><a href="index.html">Home</a><a href="courses.html">Courses</a><a href="admin.html">Admin</a></nav></div></header><main class="content"><section class="panel"><h2>कोर्स चुनें</h2><select id="course"><option>CCC</option><option>ADCA</option><option>DCA</option><option>Tally</option><option>O Level</option></select><button class="btn gradient" id="start">Sample Practice Test शुरू करें</button><p class="muted">यह डेमो अभ्यास सेट है। वास्तविक संस्थान प्रश्न बैंक Admin से Firebase में जोड़ने के लिए सुरक्षित CRUD मॉड्यूल अभी configure करना होगा।</p></section><section class="panel" id="quiz" hidden><div class="btnrow"><b id="counter"></b><b id="timer"></b></div><h3 id="question"></h3><div id="options"></div><button class="btn gradient" id="next">Next</button></section><section class="panel" id="result" hidden></section></main><script>
const bank=[['कंप्यूटर का मस्तिष्क किसे कहा जाता है?',['CPU','Monitor','Mouse','Printer'],0],['WWW का पूरा नाम क्या है?',['World Wide Web','World Word Web','Wide World Work','Web World Wide'],0],['किसका उपयोग गणना के लिए किया जाता है?',['Calculator','Speaker','Scanner','Plotter'],0],['ई-मेल में @ का उपयोग किसलिए होता है?',['यूज़र और डोमेन अलग करने के लिए','फाइल हटाने','प्रिंट','कॉपी'],0],['HTML का उपयोग किसमें होता है?',['Web page structure','Accounting','Typing only','Antivirus'],0]];
let i=0,score=0,answers=[],time=300,tick;const $=x=>document.getElementById(x);$('start').onclick=()=>{i=0;score=0;answers=[];$('result').hidden=true;$('quiz').hidden=false;time=300;clearInterval(tick);tick=setInterval(()=>{time--;$('timer').textContent='समय: '+time+' सेकंड';if(time<=0)finish()},1000);render()};function render(){$('counter').textContent=`प्रश्न ${i+1}/${bank.length}`;$('question').textContent=bank[i][0];$('options').innerHTML='';bank[i][1].forEach((v,n)=>{let l=document.createElement('label');l.className='quiz-option';l.innerHTML=`<input type="radio" name="ans" value="${n}"> ${v}`;$('options').append(l)});$('next').textContent=i===bank.length-1?'Submit':'Next'}$('next').onclick=()=>{let a=document.querySelector('input[name=ans]:checked');answers[i]=a?+a.value:-1;if(i<bank.length-1){i++;render()}else finish()};function finish(){clearInterval(tick);score=answers.reduce((s,a,n)=>s+(a===bank[n][2]?1:0),0);$('quiz').hidden=true;$('result').hidden=false;$('result').innerHTML=`<h2>आपका परिणाम</h2><p>सही उत्तर: ${score}/${bank.length}</p><p>प्रतिशत: ${Math.round(score/bank.length*100)}%</p><p class="muted">यह नमूना टेस्ट है; यह परिणाम Firebase में सेव नहीं होता।</p><button class="btn gradient" onclick="location.reload()">फिर से प्रयास करें</button>`}
</script></body></html>
