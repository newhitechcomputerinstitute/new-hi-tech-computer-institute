<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Photo Gallery | NEW HI TECH</title><link rel="stylesheet" href="style.css"></head><body><header class="pagehead"><div class="inner"><div><h1>🖼️ Photo Gallery</h1><p>Institute activities & memories</p></div><nav class="navlinks"><a href="index.html">Home</a><a href="courses.html">Courses</a><a href="contact.html">Contact</a></nav></div></header><main class="content"><section class="panel"><h2>Institute Gallery</h2><p class="muted">अपनी institute photos Admin Panel में image URL जोड़कर प्रदर्शित कर सकते हैं।</p><div class="gallery" id="gallery"></div></section></main><script>let arr=[];try{arr=JSON.parse(localStorage.getItem('nht_gallery')||'[]')}catch(e){}let g=document.getElementById('gallery');if(arr.length){arr.forEach((url,i)=>{let d=document.createElement('div');d.className='slot';let im=document.createElement('img');im.src=url;im.alt='Institute gallery photo '+(i+1);im.style='width:100%;height:100%;object-fit:cover;border-radius:15px';d.replaceChildren(im);g.append(d)})}else{for(let i=1;i<=6;i++){let d=document.createElement('div');d.className='slot';d.textContent='Institute Photo '+i;g.append(d)}};</script></body></html>
