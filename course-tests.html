<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#142b59"><title>Course Test Series | New Hi Tech</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,"Noto Sans Devanagari",sans-serif;background:#f3f6ff;color:#19243d}header{padding:20px 16px 30px;background:linear-gradient(125deg,#142b59,#315bd8,#7c3aed);color:white}.wrap{max-width:1000px;margin:auto}.back{display:inline-block;color:white;text-decoration:none;border:1px solid #ffffff90;border-radius:30px;padding:8px 14px}h1{font-size:clamp(25px,5vw,40px);margin:18px 0 6px}main{max-width:1000px;margin:24px auto;padding:0 15px 50px}.sub{line-height:1.7;opacity:.94}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px}.tile{border:0;border-radius:16px;padding:18px 12px;min-height:112px;background:linear-gradient(135deg,#e0eaff,#f0e7ff);color:#273d82;font-size:17px;font-weight:850;cursor:pointer;box-shadow:0 6px 17px #1d326018}.tile small{display:block;font-size:12px;font-weight:600;margin-top:7px;color:#64718b}.tile.ready{background:linear-gradient(135deg,#d1fae5,#dbeafe);border:1px solid #83d5b0}.tile:disabled{opacity:.7;cursor:not-allowed}.paper{color:white}.p1{background:linear-gradient(135deg,#0369a1,#06b6d4)}.p2{background:linear-gradient(135deg,#6d28d9,#a855f7)}.p3{background:linear-gradient(135deg,#047857,#22c55e)}.p4{background:linear-gradient(135deg,#c2410c,#f59e0b)}.panel{background:white;padding:18px;border-radius:18px;box-shadow:0 7px 25px #142b5912;margin-top:18px}.hidden{display:none}.notice{background:#fff7df;padding:13px;border-radius:12px;color:#74500a;line-height:1.6;margin:15px 0}.q{border:1px solid #e1e7f0;border-radius:14px;padding:15px;margin:12px 0}.q h3{font-size:17px;line-height:1.6;margin:0 0 10px}.opt{display:flex;gap:9px;padding:10px;border:1px solid #e4eaf3;border-radius:10px;margin:7px 0}.btn{border:0;border-radius:11px;padding:12px 17px;background:linear-gradient(120deg,#2563eb,#7c3aed);color:white;font-weight:800;cursor:pointer}.result{background:#ecfdf5;padding:15px;border-radius:12px;margin-top:14px}.row{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}footer{text-align:center;color:#718096;padding:20px;font-size:13px}</style></head><body><header><div class="wrap"><a class="back" href="online-test-portal.html">← सभी कोर्स</a><h1 id="heading">टेस्ट सीरीज़</h1><p class="sub" id="desc">अपनी टेस्ट सीरीज़ चुनें।</p></div></header><main><section id="paperSection" class="hidden"><h2>O Level के चार पेपर चुनें</h2><p>जिस पेपर की तैयारी करनी है, उस पर क्लिक करें।</p><div class="grid" id="papers"></div></section><section id="seriesSection" class="hidden"><h2>टेस्ट सीरीज़ 1 से 20</h2><p>खुली हुई सीरीज़ पर क्लिक करके टेस्ट शुरू करें।</p><div class="notice">जिन सीरीज़ में प्रश्न नहीं जोड़े गए हैं, वे अभी बंद रहेंगी।</div><div class="grid" id="series"></div></section><section id="testSection" class="panel hidden"><div class="row"><h2 id="testTitle">टेस्ट</h2><span id="timer"></span></div><div id="questions"></div><button class="btn" id="submit">टेस्ट जमा करें</button><div id="result"></div></section></main><footer>New Hi Tech Computer Institute</footer><script src="test-questions.js"></script><script>
const bank=window.TEST_QUESTION_BANK||{};const params=new URLSearchParams(location.search);const requested=params.get('course')||'';const names={adca:'ADCA',dca:'DCA',ccc:'CCC',tally:'Tally',bcc:'BCC','olevel-m1':'O Level – M1 IT Tools & Network Basics','olevel-m2':'O Level – M2 Web Designing & Publishing','olevel-m3':'O Level – M3 Python Programming','olevel-m4':'O Level – M4 Internet of Things'};const papers=[['olevel-m1','M1','IT Tools & Network Basics','p1'],['olevel-m2','M2','Web Designing & Publishing','p2'],['olevel-m3','M3','Python Programming','p3'],['olevel-m4','M4','Internet of Things (IoT)','p4']];let activeKey='',activeQs=[],tick=null,left=0;const $=id=>document.getElementById(id);function show(id){$(id).classList.remove('hidden')}function hide(id){$(id).classList.add('hidden')}
function renderSeries(key){activeKey=key;$('heading').textContent=names[key]+' – टेस्ट सीरीज़';$('desc').textContent='अपनी तैयारी के अनुसार 1 से 20 में से टेस्ट चुनें।';show('seriesSection');hide('paperSection');const root=$('series');root.innerHTML='';for(let i=1;i<=20;i++){const id='test-'+i,qs=(bank[key]||{})[id]||[];const b=document.createElement('button');b.className='tile'+(qs.length?' ready':'');b.disabled=!qs.length;b.innerHTML='टेस्ट सीरीज़ '+i+'<small>'+(qs.length?qs.length+' प्रश्न उपलब्ध':'अभी प्रश्न नहीं जोड़े गए')+'</small>';if(qs.length)b.onclick=()=>start(id,qs);root.appendChild(b)}}
if(requested==='olevel'){ $('heading').textContent='O Level – चारों पेपर';$('desc').textContent='O Level के M1, M2, M3 और M4 पेपर में से चुनें।';show('paperSection');const root=$('papers');papers.forEach(([key,short,detail,cls])=>{const a=document.createElement('button');a.className='tile paper '+cls;a.innerHTML='<span style="font-size:24px">📘</span><br>'+short+'<small>'+detail+' →</small>';a.onclick=()=>{history.pushState({},'',`course-tests.html?course=${key}`);renderSeries(key)};root.appendChild(a)})}else if(names[requested]){renderSeries(requested)}else{location.replace('online-test-portal.html')}
function start(id,qs){activeQs=qs;hide('seriesSection');show('testSection');$('testTitle').textContent=names[activeKey]+' · '+id.replace('test-','टेस्ट सीरीज़ ');$('questions').innerHTML=qs.map((q,i)=>'<div class="q"><h3>'+ (i+1)+'. '+esc(q.question)+'</h3>'+q.options.map((o,j)=>'<label class="opt"><input type="radio" name="q'+i+'" value="'+j+'"><span>'+esc(o)+'</span></label>').join('')+'</div>').join('');$('result').innerHTML='';$('submit').style.display='inline-block';left=Math.max(1,Number(qs[0].timeLimit)||20)*60;timer();clearInterval(tick);tick=setInterval(()=>{left--;timer();if(left<=0)finish()},1000)}function timer(){$('timer').textContent='⏱️ '+Math.floor(left/60)+':'+String(left%60).padStart(2,'0')}function finish(){if(!$('submit')||$('submit').style.display==='none')return;clearInterval(tick);let score=0,details=[];activeQs.forEach((q,i)=>{const v=document.querySelector('input[name="q'+i+'"]:checked'),ans=v?Number(v.value):-1,ok=ans===Number(q.answer);if(ok)score++;details.push('<p>'+(i+1)+'. '+(ok?'✅ सही':'❌ गलत')+' · सही उत्तर: '+esc(q.options[Number(q.answer)])+'</p>')});$('submit').style.display='none';$('result').innerHTML='<div class="result"><h3>आपका परिणाम: '+score+' / '+activeQs.length+'</h3><b>'+Math.round(score/activeQs.length*100)+'%</b>'+details.join('')+'</div>'}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}$('submit').onclick=finish;window.addEventListener('popstate',()=>location.reload());</script></body></html>
