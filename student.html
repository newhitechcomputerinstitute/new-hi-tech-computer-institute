<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Panel</title><link rel="stylesheet" href="style.css"></head><body><header class="pagehead"><div class="inner"><div><h1>Student Panel</h1><p>New Hi Tech Computer Institute</p></div><nav><a href="index.html">Home</a><a href="tests.html">Tests</a><a href="typing.html">Typing</a></nav></div></header><main class="content"><section class="panel" id="login"><h2>Student Login</h2><label class="field">Email<input id="email" type="email"></label><label class="field">Password<input id="password" type="password"></label><button class="btn gradient" id="go">Login</button><p id="msg" class="muted"></p></section><section id="dash" hidden><div class="panel"><button class="btn dark" id="logout">Logout</button><h2>मेरी जानकारी</h2><div id="profile" class="result"></div></div><div class="panel"><h2>मेरे टेस्ट रिजल्ट</h2><div id="results"></div></div><div class="panel"><h2>सूचनाएँ</h2><div id="notices"></div></div></section></main><script type="module">
import{auth,db}from'./firebase-config.js';import{signInWithEmailAndPassword,onAuthStateChanged,signOut}from'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';import{doc,getDoc,collection,getDocs,query,where}from'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';const $=x=>document.getElementById(x);async function load(u){$('login').hidden=true;$('dash').hidden=false;let p=await getDoc(doc(db,'students',u.uid));$('profile').textContent=p.exists()?JSON.stringify(p.data(),null,2):'Student profile अभी Admin द्वारा बनाया नहीं गया है।';try{let s=await getDocs(query(collection(db,'results'),where('uid','==',u.uid)));$('results').textContent=s.empty?'अभी कोई रिजल्ट नहीं है।':s.docs.map(d=>JSON.stringify(d.data())).join('\n')}catch(e){$('results').textContent=e.message}try{let s=await getDocs(query(collection(db,'notices'),where('status','==','published')));$('notices').textContent=s.docs.map(d=>d.data().title+' — '+d.data().body).join('\n')||'अभी कोई सूचना नहीं'}catch(e){$('notices').textContent=e.message}}onAuthStateChanged(auth,u=>{if(u)load(u)});$('go').onclick=async()=>{try{await signInWithEmailAndPassword(auth,$('email').value,$('password').value);load(auth.currentUser)}catch(e){$('msg').textContent=e.message}};$('logout').onclick=()=>signOut(auth).then(()=>location.reload());
</script></body></html>
