<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="styles.css"><title>Online Test Portal</title></head><body><script src="app.js"></script><script>shell(banner('Online Test Portal','Select your course to explore its test series')+`<section class="section"><h2>Choose Your Course</h2><input class="search" id="f" placeholder="Search course"><div class="coursegrid" id="cg">${C.map(c=>`<article class="card"><div class="ico">${c[1]}</div><h2>${c[0]}</h2><p>${c[2]}</p><a class="btn" href="series.html?course=${c[3]}">View Test Series →</a></article>`).join('')}</div></section>`);document.getElementById('f').oninput=e=>document.querySelectorAll('#cg .card').forEach(x=>x.classList.toggle('hide',!x.innerText.toLowerCase().includes(e.target.value.toLowerCase())))</script></body></html>
