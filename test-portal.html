<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CCC Test 1 | New Hi Tech Computer Institute</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,'Noto Sans Devanagari',sans-serif;background:#f0f5ff;color:#14213d}header{background:linear-gradient(135deg,#075985,#2563eb);color:white;padding:22px 16px;text-align:center}header h1{font-size:clamp(24px,5vw,38px);margin:0}header p{margin:7px 0 0}main{max-width:900px;margin:18px auto;padding:0 12px}.card{background:white;border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 4px 18px #1232}.top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-weight:700;color:#1d4ed8}.question{border-top:1px solid #e5eaf5;padding:17px 0}.question h3{font-size:17px}label{display:block;padding:10px;border:1px solid #d9e2f2;border-radius:10px;margin:8px 0;cursor:pointer}label:has(input:checked){background:#eaf2ff;border-color:#2563eb}input{margin-right:8px}button{border:0;border-radius:12px;background:#2563eb;color:white;padding:13px 18px;font-weight:700;font-size:16px;cursor:pointer}button.secondary{background:#64748b}#result{display:none}.correct{background:#dcfce7!important;border-color:#16a34a!important}.wrong{background:#fee2e2!important;border-color:#dc2626!important}</style></head><body><header><h1>New Hi Tech Computer Institute</h1><p>CCC Online Test Series · Test 1: Computer Fundamentals</p></header><main><section class="card"><div class="top"><span>कुल प्रश्न: 50 · कुल अंक: 50</span><span>समय: <b id="timer">60:00</b></span></div><p>सभी प्रश्नों के उत्तर चुनें। टेस्ट जमा करने के बाद स्कोर और सही उत्तर दिखेंगे।</p></section><form id="quiz" class="card"></form><section id="result" class="card"></section></main><script>
const qs=[["कंप्यूटर क्या है?", ["इलेक्ट्रॉनिक मशीन", "केवल टीवी", "केवल मोबाइल", "केवल कैलकुलेटर"], 0], ["कंप्यूटर का मुख्य कार्य क्या है?", ["केवल गेम खेलना", "डेटा प्रोसेस करना", "केवल गाना बजाना", "केवल वीडियो देखना"], 1], ["कंप्यूटर का मस्तिष्क किसे कहा जाता है?", ["RAM", "Monitor", "CPU", "Mouse"], 2], ["CPU का पूरा नाम क्या है?", ["Central Processing Unit", "Computer Personal Unit", "Central Program Utility", "Control Processing User"], 0], ["कंप्यूटर मूल रूप से किस भाषा में कार्य करता है?", ["हिंदी", "अंग्रेजी", "मशीन भाषा", "संस्कृत"], 2], ["कंप्यूटर डेटा किस रूप में प्रोसेस करता है?", ["दशमलव", "बाइनरी", "केवल अक्षर", "केवल चित्र"], 1], ["बाइनरी सिस्टम में कितने अंक होते हैं?", ["2", "8", "10", "16"], 0], ["बाइनरी में कौन से अंक उपयोग होते हैं?", ["1 और 2", "0 और 1", "2 और 3", "0 से 9"], 1], ["कंप्यूटर की पहली पीढ़ी में किसका उपयोग होता था?", ["ट्रांजिस्टर", "IC", "वैक्यूम ट्यूब", "माइक्रोप्रोसेसर"], 2], ["कंप्यूटर का उपयोग किस क्षेत्र में किया जाता है?", ["शिक्षा", "बैंक", "चिकित्सा", "ये सभी"], 3], ["निम्न में से Input Device कौन है?", ["Monitor", "Keyboard", "Printer", "Speaker"], 1], ["Mouse किस प्रकार का उपकरण है?", ["Input", "Output", "Storage", "Processing"], 0], ["स्क्रीन पर जानकारी दिखाने वाला उपकरण कौन है?", ["Keyboard", "Scanner", "Monitor", "Microphone"], 2], ["Printer किस प्रकार का उपकरण है?", ["Input", "Output", "Processing", "Memory"], 1], ["आवाज रिकॉर्ड करने के लिए किसका उपयोग होता है?", ["Monitor", "Printer", "Microphone", "Plotter"], 2], ["कागज की फोटो/डॉक्यूमेंट कंप्यूटर में लाने के लिए क्या प्रयोग होता है?", ["Scanner", "Speaker", "Projector", "Printer"], 0], ["Joystick का उपयोग मुख्यतः किसमें होता है?", ["टाइपिंग", "गेम खेलने में", "प्रिंटिंग", "स्कैनिंग"], 1], ["Barcode Reader क्या करता है?", ["बारकोड पढ़ता है", "आवाज रिकॉर्ड करता है", "फोटो छापता है", "स्क्रीन दिखाता है"], 0], ["Speaker किस प्रकार का उपकरण है?", ["Input", "Output", "Storage", "Processing"], 1], ["Touchscreen किस प्रकार कार्य कर सकती है?", ["केवल Input", "केवल Output", "Input और Output दोनों", "केवल Storage"], 2], ["RAM का पूरा नाम क्या है?", ["Read Access Memory", "Random Access Memory", "Run Access Machine", "Ready Access Memory"], 1], ["ROM का पूरा नाम क्या है?", ["Read Only Memory", "Random Open Memory", "Run Only Machine", "Read Online Memory"], 0], ["RAM किस प्रकार की मेमोरी है?", ["स्थायी", "अस्थायी", "केवल बाहरी", "ऑप्टिकल"], 1], ["कंप्यूटर बंद होने पर RAM का डेटा सामान्यतः क्या होता है?", ["सुरक्षित रहता है", "प्रिंट हो जाता है", "मिट जाता है", "इंटरनेट पर चला जाता है"], 2], ["निम्न में से स्टोरेज डिवाइस कौन है?", ["Keyboard", "Mouse", "SSD", "Monitor"], 2], ["Pen Drive किस प्रकार का स्टोरेज है?", ["Flash Memory", "केवल RAM", "केवल ROM", "Cache"], 0], ["CD का पूरा नाम क्या है?", ["Compact Disc", "Computer Disk", "Control Drive", "Common Data"], 0], ["DVD का पूरा नाम क्या है?", ["Digital Video Device", "Digital Versatile Disc", "Data Visual Drive", "Direct Video Disk"], 1], ["1 Byte में कितने Bits होते हैं?", ["2", "4", "8", "16"], 2], ["स्टोरेज क्षमता की इकाई कौन है?", ["Meter", "Liter", "Kilogram", "Gigabyte"], 3], ["Operating System क्या है?", ["Hardware", "System Software", "Input Device", "Output Device"], 1], ["निम्न में से Operating System कौन है?", ["Windows", "MS Word", "Photoshop", "Google"], 0], ["Android क्या है?", ["मोबाइल Operating System", "Printer", "Keyboard", "Spreadsheet"], 0], ["MS Word किस प्रकार का सॉफ्टवेयर है?", ["System Software", "Application Software", "Hardware", "Firmware"], 1], ["कंप्यूटर में फाइल क्या होती है?", ["डेटा का संग्रह", "केवल मशीन", "केवल स्क्रीन", "केवल कीबोर्ड"], 0], ["Folder का उपयोग किस लिए होता है?", ["फाइल व्यवस्थित करने के लिए", "कंप्यूटर बंद करने के लिए", "आवाज सुनने के लिए", "प्रिंट निकालने के लिए"], 0], ["कंप्यूटर चालू होने की प्रक्रिया क्या कहलाती है?", ["Scanning", "Booting", "Editing", "Printing"], 1], ["कंप्यूटर बंद करने का सही विकल्प क्या है?", ["Refresh", "Restart", "Shut Down", "Rename"], 2], ["Antivirus का उपयोग किस लिए किया जाता है?", ["वायरस से सुरक्षा", "टाइपिंग", "फोटो बनाना", "गाना सुनना"], 0], ["कंप्यूटर वायरस क्या है?", ["उपयोगी उपकरण", "हानिकारक प्रोग्राम", "Output Device", "मेमोरी चिप"], 1], ["WWW का पूरा नाम क्या है?", ["World Wide Web", "World Web Window", "Wide World Web", "Web Wide World"], 0], ["वेबसाइट खोलने के लिए किसका उपयोग होता है?", ["Web Browser", "Paint", "Calculator", "Notepad"], 0], ["निम्न में से Web Browser कौन है?", ["MS Excel", "Google Chrome", "Windows", "VLC"], 1], ["URL का पूरा नाम क्या है?", ["Uniform Resource Locator", "Universal Record Link", "User Resource Line", "Uniform Read Link"], 0], ["Email का पूरा नाम क्या है?", ["Easy Mail", "Electronic Mail", "Express Mail", "Extra Mail"], 1], ["Save करने की Shortcut Key क्या है?", ["Ctrl + P", "Ctrl + S", "Ctrl + X", "Ctrl + D"], 1], ["Copy करने की Shortcut Key क्या है?", ["Ctrl + C", "Ctrl + V", "Ctrl + Z", "Ctrl + A"], 0], ["Paste करने की Shortcut Key क्या है?", ["Ctrl + X", "Ctrl + P", "Ctrl + V", "Ctrl + S"], 2], ["Print करने की Shortcut Key क्या है?", ["Ctrl + A", "Ctrl + P", "Ctrl + C", "Ctrl + N"], 1], ["सभी टेक्स्ट Select करने की Shortcut Key क्या है?", ["Ctrl + X", "Ctrl + V", "Ctrl + A", "Ctrl + Z"], 2]];let seconds=3600,submitted=false;const timer=document.getElementById('timer');function tick(){if(submitted)return;seconds--;timer.textContent=Math.floor(seconds/60)+':'+String(seconds%60).padStart(2,'0');if(seconds<=0)submitTest();}const interval=setInterval(tick,1000);const form=document.getElementById('quiz');qs.forEach((q,i)=>{let div=document.createElement('div');div.className='question';div.innerHTML='<h3>'+(i+1)+'. '+q[0]+'</h3>';q[1].forEach((opt,j)=>{let lab=document.createElement('label');lab.innerHTML='<input type="radio" name="q'+i+'" value="'+j+'"> '+String.fromCharCode(65+j)+'. '+opt;div.appendChild(lab)});form.appendChild(div)});let btn=document.createElement('button');btn.type='button';btn.textContent='टेस्ट जमा करें और रिजल्ट देखें';btn.onclick=submitTest;form.appendChild(btn);function submitTest(){if(submitted)return;submitted=true;clearInterval(interval);let score=0;qs.forEach((q,i)=>{let selected=form.querySelector('input[name=q'+i+']:checked');if(selected&&Number(selected.value)===q[2])score++;let labels=form.querySelectorAll('.question')[i].querySelectorAll('label');labels[q[2]].classList.add('correct');if(selected&&Number(selected.value)!==q[2])labels[Number(selected.value)].classList.add('wrong');});let res=document.getElementById('result');res.style.display='block';res.innerHTML='<h2>आपका परिणाम</h2><p style="font-size:24px;font-weight:bold;color:#2563eb">'+score+' / 50 अंक</p><p>सही उत्तर: '+score+' · गलत/छूटे: '+(50-score)+' · प्रतिशत: '+(score*2)+'%</p><p>हरा विकल्प सही उत्तर है; लाल विकल्प आपके गलत चुने उत्तर को दिखाता है।</p><button class="secondary" onclick="location.reload()">दोबारा टेस्ट दें</button>';res.scrollIntoView({behavior:'smooth'});form.querySelectorAll('input').forEach(x=>x.disabled=true);}
</script></body></html>
