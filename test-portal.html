let activeQs=qs;let seconds=3600,submitted=false,interval=null;const $=id=>document.getElementById(id);function goHome(){$('home').classList.remove('hidden');$('coursePanel').classList.add('hidden');$('quizPanel').classList.add('hidden')}
function showCourse(course){$('home').classList.add('hidden');$('quizPanel').classList.add('hidden');$('coursePanel').classList.remove('hidden');$('courseTitle').textContent=course+' ONLINE TEST SERIES';$('courseDesc').textContent=course==='CCC'?'हर टेस्ट में 50 प्रश्न · समय 60 मिनट · ऑटो रिजल्ट':'इस कोर्स के अलग-अलग विषयों की टेस्ट सीरीज़';let list=$('testList');list.innerHTML='';let names=course==='CCC'?['Computer Fundamentals','Hardware एवं Software','Windows एवं File Management','LibreOffice Writer','LibreOffice Calc','LibreOffice Impress','Internet एवं Web','Email एवं Digital Communication','Cyber Security एवं Digital Payment','Full Mock Test']:course==='O Level'?['IT Tools and Network Basics','Web Designing and Publishing','Programming and Problem Solving through Python','Internet of Things and its Applications','O Level Full Mock Test']:course==='ADCA'?['Computer Fundamentals','Operating System','MS Office','Advanced Excel','DTP एवं Graphics','HTML एवं CSS','Database','Programming','ADCA Full Mock Test']:course==='Tally Prime'?['Tally Introduction एवं Company Creation','Groups एवं Ledgers','Accounting Vouchers','Purchase एवं Sales','GST','Inventory Management','Banking एवं Reconciliation','Payroll','Final Accounts','Full Mock Test']:['Computer Fundamentals','Windows','MS Word','MS Excel','PowerPoint','Internet','DCA Full Mock Test'];names.forEach((name,i)=>{let row=document.createElement('div');row.className='testrow';let info=document.createElement('div');info.innerHTML='<b>Test '+(i+1)+' – '+name+'</b><div class="muted">50 प्रश्न · 60 मिनट</div>';row.appendChild(info);let b=document.createElement('button');if((course==='CCC'&&i===0)||(course==='Tally Prime'&&i===0)){b.textContent='टेस्ट शुरू करें';b.onclick=()=>course==='CCC'?startCCC():startTally();}else{b.textContent='जल्द उपलब्ध';b.disabled=true;b.style.opacity='.55'}row.appendChild(b);list.appendChild(row)});}
function backToTests(){if(interval)clearInterval(interval);$('quizPanel').classList.add('hidden');$('coursePanel').classList.remove('hidden')}
function startCCC(){activeQs=qs;$('coursePanel').classList.add('hidden');$('quizPanel').classList.remove('hidden');$('quizTitle').textContent='CCC · Test 1 – Computer Fundamentals';renderQuiz();}
function startTally(){activeQs=tallyQs;$('coursePanel').classList.add('hidden');$('quizPanel').classList.remove('hidden');$('quizTitle').textContent='Tally Prime · Test 1 – Introduction & Accounting';renderQuiz();}
function renderQuiz(){seconds=3600;submitted=false;$('timer').textContent='60:00';$('result').style.display='none';$('result').innerHTML='';let form=$('quiz');form.innerHTML='';activeQs.forEach((q,i)=>{let div=document.createElement('div');div.className='question';let h=document.createElement('h3');h.textContent=(i+1)+'. '+q[0];div.appendChild(h);q[1].forEach((opt,j)=>{let lab=document.createElement('label');let radio=document.createElement('input');radio.type='radio';radio.name='q'+i;radio.value=j;lab.appendChild(radio);lab.append(' '+String.fromCharCode(65+j)+'. '+opt);div.appendChild(lab)});form.appendChild(div)});let btn=document.createElement('button');btn.type='button';btn.textContent='टेस्ट जमा करें और रिजल्ट देखें';btn.onclick=submitTest;form.appendChild(btn);if(interval)clearInterval(interval);interval=setInterval(()=>{if(submitted)return;seconds--; $('timer').textContent=Math.floor(seconds/60)+':'+String(seconds%60).padStart(2,'0');if(seconds<=0)submitTest()},1000)}
function submitTest(){if(submitted)return;submitted=true;clearInterval(interval);let form=$('quiz'),score=0;activeQs.forEach((q,i)=>{let selected=form.querySelector('input[name=q'+i+']:checked');if(selected&&Number(selected.value)===q[2])score++;let labels=form.querySelectorAll('.question')[i].querySelectorAll('label');labels[q[2]].classList.add('correct');if(selected&&Number(selected.value)!==q[2])labels[Number(selected.value)].classList.add('wrong')});$('result').style.display='block';$('result').innerHTML='<h2>आपका परिणाम</h2><p style="font-size:24px;font-weight:bold;color:#2563eb">'+score+' / 50 अंक</p><p>सही उत्तर: '+score+' · गलत/छूटे: '+(activeQs.length-score)+' · प्रतिशत: '+(score*2)+'%</p><p>हरा विकल्प सही उत्तर है; लाल विकल्प आपका गलत चुना उत्तर दिखाता है।</p><button class="secondary" onclick="renderQuiz()">दोबारा टेस्ट दें</button>';$('result').scrollIntoView({behavior:'smooth'});form.querySelectorAll('input').forEach(x=>x.disabled=true)}
