<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Typing Practice</title><link rel="stylesheet" href="style.css"></head><body><header class="pagehead"><div class="inner"><div><h1>Typing Practice</h1><p>English · Hindi · Keyboard Practice</p></div><nav><a href="index.html">Home</a><a href="student.html">Student</a></nav></div></header><main class="content"><section class="panel"><label class="field">भाषा / Layout<select id="layout"><option>English</option><option>Mangal (Unicode Hindi)</option><option>Inscript (Unicode Hindi)</option><option>Kruti Dev (font/layout आवश्यक)</option></select></label><label class="field">समय<select id="duration"><option value="1">1 मिनट</option><option value="5">5 मिनट</option><option value="10">10 मिनट</option><option value="15">15 मिनट</option><option value="30" selected>30 मिनट</option></select></label><label><input id="backspace" type="checkbox" checked style="width:auto"> Backspace की अनुमति</label><p id="sample" class="result">Practice makes a person accurate and confident. Learn computer skills every day.</p><textarea id="typed" class="editor" placeholder="यहाँ टाइप करना शुरू करें..."></textarea><div class="btnrow"><button class="btn gradient" id="start">Start / Reset</button><b id="clock">30:00</b></div><div id="score" class="result">WPM और Accuracy यहाँ दिखाई देंगे।</div></section></main><script>
const $=x=>document.getElementById(x);let left=1800,timer=null,started=false;function display(){$('clock').textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0')}function calc(){let t=$('typed').value,words=t.trim()?t.trim().split(/\s+/).length:0,mins=Math.max((Number($('duration').value)*60-left)/60,1/60),correct=0;const target=$('sample').textContent;for(let j=0;j<Math.min(t.length,target.length);j++)if(t[j]===target[j])correct++;let accuracy=t.length?Math.round(correct/t.length*100):0;$('score').textContent=`Gross WPM: ${Math.round(words/mins)} | Accuracy: ${accuracy}% | Characters: ${t.length}`}$('start').onclick=()=>{clearInterval(timer);left=Number($('duration').value)*60;$('typed').value='';$('typed').disabled=false;started=true;display();$('score').textContent='टाइप करना शुरू करें।';timer=setInterval(()=>{left--;display();calc();if(left<=0){clearInterval(timer);$('typed').disabled=true;calc();$('score').textContent+=' | समय पूरा हुआ।'}},1000)};$('typed').addEventListener('keydown',e=>{if(e.key==='Backspace'&&!$('backspace').checked)e.preventDefault()});$('typed').addEventListener('input',calc);display();
</script></body></html>
