<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Practical Lab</title><link rel="stylesheet" href="style.css"></head><body><header class="pagehead"><div class="inner"><div><h1>Practical Lab</h1><p>सीखें और खुद अभ्यास करें</p></div><nav><a href="index.html">Home</a><a href="courses.html">Courses</a></nav></div></header><main class="content"><section class="panel"><h2>प्रैक्टिकल चुनें</h2><div class="grid four"><button class="btn dark" onclick="example('html')">Web Designing</button><button class="btn dark" onclick="example('python')">Python Basics</button><button class="btn dark" onclick="example('office')">IT Tools</button><button class="btn dark" onclick="example('iot')">IoT</button></div><label class="field">HTML/CSS Editor<textarea id="code" class="editor"><h2>Welcome to Practical Lab</h2><p>My first web page.</p></textarea></label><button class="btn gradient" id="run">Run HTML Preview</button><button class="btn dark" id="clear">Clear</button><h3>Output</h3><iframe id="output" title="HTML output" sandbox="allow-scripts" style="width:100%;height:260px;background:white;border:1px solid #ddd;border-radius:12px"></iframe><p id="note" class="muted">Python और IoT के लिए guided examples दिए जाएँगे; यह browser में Python compiler नहीं है।</p></section></main><script>const $=x=>document.getElementById(x);$('run').onclick=()=>{$('output').srcdoc=$('code').value};$('clear').onclick=()=>{$('code').value='';$('output').srcdoc=''};function example(x){const data={html:'<h1>My Institute</h1><p>Learning HTML</p><button onclick="alert(\'Hello\')">Click me</button>',python:'# Python example\nname = "Student"\nprint("Welcome", name)\n# Run this example in a Python interpreter',office:'IT Tools Practical: Create a document, format headings, insert a table and save as PDF.',iot:'IoT Practical: Sensor → Microcontroller → Network → Dashboard\nStudy input, processing and output.'};$('code').value=data[x];if(x==='html')$('run').click();else $('note').textContent='यह guided example है। Python/IoT को चलाने के लिए उपयुक्त external simulator या interpreter आवश्यक है।'}</script></body></html>
