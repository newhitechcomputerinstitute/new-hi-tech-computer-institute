<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="styles.css"><title>Practice Test</title></head><body><script src="app.js"></script><script>let k=new URLSearchParams(location.search).get('course')||'ccc',idx=+(new URLSearchParams(location.search).get('set')||0),c=C.find(x=>x[3]===k)||C[2],qs=[['CPU का पूरा नाम क्या है?',['Central Processing Unit','Computer Personal Unit','Central Program Utility'],0],['HTML का उपयोग किसलिए होता है?',['Web page structure','Image editing','Accounting'],0],['Python में output के लिए कौन सा function है?',['input()','print()','show()'],1],['Spreadsheet में cell किसका intersection है?',['दो rows','Row और column','दो columns'],1],['डेटा स्थायी रूप से कहाँ रहता है?',['RAM','SSD / Hard Disk','Cache'],1]];let n=0,a={},sec=300;function draw(){let q=qs[n];document.getElementById('qt').innerText=q[0];document.getElementById('qn').innerText='Question '+(n+1)+' / '+qs.length;document.getElementById('op').innerHTML=q[1].map((o,i)=>`<label class="option"><input type="radio" name="a" value="${i}" ${a[n]===i?'checked':''}> ${o}</label>`).join('');document.getElementById('next').innerText=n===qs.length-1?'Submit Test':'Next →'}function done(){clearInterval(t);let score=qs.filter((q,i)=>a[i]===q[2]).length;document.querySelector('main').innerHTML=`<section class="section card" style="text-align:center"><h1>🏆 Test Result</h1><h2>${score} / ${qs.length}</h2><p>This is a sample demo test. Your old portal data is not connected.</p><a class="btn" href="series.html?course=${k}">Back to Test Series</a></section>`}shell(banner('Practice Test',c[0]+' • Timed sample test')+`<main class="section testgrid"><div class="card"><small id="qn"></small><h2 id="qt"></h2><div id="op"></div><button class="btn" id="next">Next →</button></div><aside><div class="timer" id="tm">05:00</div><div class="card"><h3>Instructions</h3><p>Choose one answer. Submit to view your score.</p><button class="btn" id="sub">Submit Test</button></div></aside></main>`);draw();document.getElementById('op').onchange=e=>{if(e.target.name==='a')a[n]=+e.target.value};document.getElementById('next').onclick=()=>{if(n===qs.length-1)done();else{n++;draw()}};document.getElementById('sub').onclick=done;let t=setInterval(()=>{sec--;document.getElementById('tm').innerText=Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0');if(sec<=0)done()},1000)</script></body></html>
