<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | New Hi Tech</title><link rel="stylesheet" href="style.css"></head><body><header class="pagehead"><div class="inner"><div><h1>Admin Dashboard</h1><p>केवल अधिकृत Admin के लिए</p></div><nav><a href="index.html">Home</a><a href="tests.html">Tests</a></nav></div></header><main class="content"><section class="panel" id="login"><h2>Firebase Admin Login</h2><label class="field">Email<input id="email" type="email"></label><label class="field">Password<input id="password" type="password"></label><button class="btn gradient" id="loginBtn">Login</button><p id="msg" class="muted"></p></section><section class="panel" id="dash" hidden><div class="btnrow"><h2>Dashboard</h2><button class="btn dark" id="logout">Logout</button></div><h3>Notice प्रकाशित करें</h3><label class="field">शीर्षक<input id="title"></label><label class="field">सूचना<textarea id="body"></textarea></label><button class="btn gradient" id="publish">Publish</button><p id="status" class="muted"></p><h3>Enquiry देखने के लिए</h3><button class="btn dark" id="refresh">Refresh Enquiries</button><div id="enquiries"></div><p class="muted">यह प्रारंभिक Admin सुविधा है। प्रश्न बैंक, फीस, उपस्थिति, फाइल अपलोड और ग्रेडिंग के लिए अलग सुरक्षित मॉड्यूल व Rules लागू करना बाकी है।</p></section></main><script type="module">
import{auth,db,ADMIN_UID}from'./firebase-config.js';import{signInWithEmailAndPassword,onAuthStateChanged,signOut}from'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';import{collection,addDoc,getDocs,serverTimestamp}from'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';const $=x=>document.getElementById(x);function admin(u){if(u?.uid!==ADMIN_UID){$('msg').textContent='यह अकाउंट Admin के रूप में अधिकृत नहीं है।';return false}$('login').hidden=true;$('dash').hidden=false;return true}onAuthStateChanged(auth,u=>{if(u)admin(u)});$('loginBtn').onclick=async()=>{try{await signInWithEmailAndPassword(auth,$('email').value,$('password').value);admin(auth.currentUser)}catch(e){$('msg').textContent=e.message}};$('logout').onclick=()=>signOut(auth).then(()=>location.reload());$('publish').onclick=async()=>{try{if(auth.currentUser?.uid!==ADMIN_UID)throw Error('Admin login आवश्यक');await addDoc(collection(db,'notices'),{title:$('title').value.trim(),body:$('body').value.trim(),status:'published',createdAt:serverTimestamp(),createdBy:auth.currentUser.uid});$('status').textContent='Notice सेव हो गया।'}catch(e){$('status').textContent='सेव नहीं हुआ: '+e.message}};$('refresh').onclick=async()=>{try{const s=await getDocs(collection(db,'enquiries'));$('enquiries').innerHTML='';s.forEach(d=>{let p=document.createElement('p');p.className='result';p.textContent=JSON.stringify(d.data());$('enquiries').append(p)})}catch(e){$('enquiries').textContent=e.message}};
</script></body></html>
