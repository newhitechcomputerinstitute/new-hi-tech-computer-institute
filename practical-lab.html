<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="styles.css"><title>O Level Practical Lab</title></head><body><script src="app.js"></script><script>shell(banner('O Level Practical Lab','Code • Run • Learn')+`<section class="section"><div class="grid"><article class="card"><h2>🌐 Web Design</h2><p>HTML, CSS, JavaScript live preview</p><button class="btn" onclick="openLab('web')">Open Editor</button></article><article class="card"><h2>🐍 Python</h2><p>Python code practice</p><button class="btn" onclick="openLab('py')">Open Python</button></article><article class="card"><h2>🔌 IoT</h2><p>Arduino / ESP32 code practice</p><button class="btn" onclick="openLab('iot')">Open IoT</button></article></div><div class="card" id="wb" style="margin-top:20px;display:none"><h2 id="lt">Code Editor</h2><div class="editor"><textarea id="code"></textarea><iframe id="prev"></iframe></div><button class="btn" onclick="run()">▶ Run Code</button><p id="note">Web code preview runs in browser. Python and IoT require runtime/hardware integration.</p></div></section>`);window.openLab=t=>{document.getElementById('wb').style.display='block';document.getElementById('lt').innerText=t==='web'?'Web Design Editor':t==='py'?'Python Editor':'IoT Editor';document.getElementById('code').value=t==='web'?'<!doctype html><h1 style="color:blue">Welcome to New Hi Tech!</h1><button onclick="alert(\'Hello\')">Click me</button>':t==='py'?'print("Welcome to New Hi Tech")':'// Arduino LED Blink Simulation\\nvoid setup(){ pinMode(2,OUTPUT); }\\nvoid loop(){ digitalWrite(2,HIGH); delay(1000); digitalWrite(2,LOW); delay(1000); }';document.getElementById('note').innerText=t==='web'?'HTML runs in live preview.': 'Code editor demo only. Python runtime / physical IoT board is not connected.';run()};window.run=()=>{let t=document.getElementById('lt').innerText,code=document.getElementById('code').value;document.getElementById('prev').srcdoc=t.startsWith('Web')?code:'<pre style="padding:18px;background:#07182f;color:#9ef">'+code.replaceAll('<','&lt;')+'</pre><p>Execution engine not connected in this preview.</p>'}</script></body></html>
