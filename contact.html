<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admission Enquiry</title><link rel="stylesheet" href="style.css"></head><body><header class="pagehead"><div class="inner"><div><h1>Admission Enquiry</h1><p>हमसे संपर्क करें</p></div><nav><a href="index.html">Home</a><a href="courses.html">Courses</a></nav></div></header><main class="content"><section class="panel"><h2>अपनी जानकारी भेजें</h2><label class="field">नाम<input id="name" required></label><label class="field">मोबाइल<input id="mobile" inputmode="numeric" maxlength="10"></label><label class="field">कोर्स<select id="course"><option>CCC</option><option>ADCA</option><option>DCA</option><option>Tally</option><option>O Level</option></select></label><label class="field">संदेश<textarea id="message"></textarea></label><button class="btn gradient" id="send">Submit Enquiry</button><p id="status" class="muted"></p></section><section class="panel"><h3>संपर्क</h3><p>Ajay Sir: <a href="tel:6394036352">6394036352</a></p><p>Sudhir Shukla Sir: <a href="tel:7408479110">7408479110</a></p><p>Near Medical College, KDC Road, Bahraich, Uttar Pradesh</p></section></main><script type="module">import{db}from'./firebase-config.js';import{collection,addDoc,serverTimestamp}from'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';document.getElementById('send').onclick=async()=>{const $=id=>document.getElementById(id),name=$('name').value.trim(),mobile=$('mobile').value.trim();if(!name||!/^[6-9][0-9]{9}$/.test(mobile)){$('status').textContent='कृपया नाम और सही 10 अंकों का मोबाइल भरें।';return}try{await addDoc(collection(db,'enquiries'),{name,mobile,course:$('course').value,message:$('message').value.trim(),status:'new',createdAt:serverTimestamp()});$('status').textContent='धन्यवाद! आपकी enquiry भेज दी गई है।'}catch(e){$('status').textContent='Enquiry सेव नहीं हुई। Firebase Rules जाँचें: '+e.message}}</script></body></html>
